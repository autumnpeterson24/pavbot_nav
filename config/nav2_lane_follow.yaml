bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    odom_frame: odom


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    cmd_vel_topic: "cmd_vel_nav"

    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # Timing / rollout
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1

      # Limits for pavbot
      vx_max: 1.5 # 3.35 mph
      vx_min: -0.2 # can back up now
      wz_max: 2.2

      # Noise (bigger = explores more)
      vx_std: 0.35
      wz_std: 0.8

      # Critics = how it scores trajectories
      critics: ["ConstraintCritic", "ObstaclesCritic", "PathAlignCritic", "PathFollowCritic", "GoalCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 6.0
        critical_weight: 80.0
        collision_cost: 100000.0
        collision_margin_distance: 0.25

      PathAlignCritic:
        enabled: true
        weight: 10.0

      PathFollowCritic:
        enabled: true
        weight: 15.0

      GoalCritic:
        enabled: true
        weight: 8.0


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    # Smoother subscribes to controller output...
    input_topic: "cmd_vel_nav"
    # ...and publishes to the robot
    output_topic: "cmd_vel"

    smoothing_frequency: 30.0
    feedback: "OPEN_LOOP"

    # Limits (tune later)
    max_velocity: [1.9, 0.0, 1.9]
    min_velocity: [-0.1, 0.0, -1.5]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    odom_frame: odom
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      robot_radius: 0.45
      always_send_full_costmap: true
      # (optional but nice)
      transform_tolerance: 0.2
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05

      plugins: ["potholes", "inflation_layer"]

      potholes:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pothole_cloud
        combination_method: 1  # max
        track_unknown_space: false

        pothole_cloud:
          observation_persistence: 0.5   # seconds
          expected_update_rate: 10.0
          topic: /potholes/points
          data_type: "PointCloud2"
          marking: true
          clearing: false        

          obstacle_range: 20.0      # <-- IMPORTANT (accept marking out to 20m)
          raytrace_range: 0.0       # clearing off anyway; ok to set 0

          min_obstacle_height: -1.0
          max_obstacle_height:  0.5

          inf_is_valid: false
          max_z: 0.5
          min_z: -0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.6      # pothole_radius (0.3048) + safety margin + half footprint-ish
        cost_scaling_factor: 2.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      robot_radius: 0.45
      plugins: ["inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 2.5




lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - local_costmap
      - global_costmap
      - bt_navigator
      - velocity_smoother
corridor_path_follower:
  ros__parameters:
    use_sim_time: true

    control_rate_hz: 20.0
    path_stale_sec: 0.40
    min_path_points: 3

    lookahead_dist_m: 0.9
    min_lookahead_dist_m: 0.7
    max_lookahead_dist_m: 1.10

    max_linear_speed_mps: 0.65
    min_linear_speed_mps: 0.10
    max_angular_speed_radps: 0.9

    k_ang: 1.1
    k_lat: 0.6

    slowdown_yaw_error_rad: 0.25
    stop_yaw_error_rad: 0.75
    slowdown_lateral_error_m: 0.20
    stop_lateral_error_m: 0.55

    path_hold_stop_sec: 0.60
    goal_taper_dist_m: 1.2
    stop_at_path_end_dist_m: 0.35

    cmd_smooth_alpha: 0.82
    publish_debug_marker: true
    debug_print_hz: 2.0